benchmark_version: phase4b-0.1
tier: smoke
run_label: phase4b-smoke
output_root: runs/phase4b
scenario_source: configs/benchmark/phase3a-mini.yaml
scenario_ids: [garch-persistent, structural-mean-break]
return_seeds: [41000001]
seed_namespace: phase4b-smoke-v1
systems: &systems
  - static-deterministic-router
  - adaptive-deterministic-policy
  - monolithic-agent
  - unconstrained-specialized-agents
  - evidence-constrained-phase4a-agents
  - oracle
regimes: &regimes [full-information, budgeted-observation, open-world-provenance]
conditions:
  - condition_id: full-structured
    regime: full-information
    initial_groups: [returns-summary, linear-dependence, squared-dependence, distribution, stability, structured-provenance]
    diagnostic_budget: 0
    sensitivity_budget: 0
    diagnostic_costs: &costs {linear-dependence: 1.0, squared-dependence: 1.0, distribution: 1.0, stability: 1.0}
    critical_groups: []
    provenance_template: full-structured
    ambiguity: none
  - condition_id: squared-hidden
    regime: budgeted-observation
    initial_groups: [returns-summary, linear-dependence, distribution, stability]
    diagnostic_budget: 2
    sensitivity_budget: 1
    diagnostic_costs: *costs
    critical_groups: [squared-dependence]
    provenance_template: incomplete
    ambiguity: squared-return dependence hidden initially
  - condition_id: provenance-injection-data
    regime: open-world-provenance
    initial_groups: [returns-summary]
    diagnostic_budget: 2
    sensitivity_budget: 1
    diagnostic_costs: *costs
    critical_groups: [squared-dependence, stability]
    provenance_template: prompt-injection-data
    ambiguity: untrusted instruction-like prose
provider_mode: mock
model:
  provider: mock
  model: deterministic-fixture-v1
  model_version: phase4b-mock-1.0
  temperature: 0.0
  maximum_response_tokens: 600
  maximum_input_tokens: 1200
  maximum_model_calls: 4
  retries: 1
  timeout_seconds: 20.0
  input_cost_per_million_tokens: 0.0
  output_cost_per_million_tokens: 0.0
  expected_input_token_fraction: 0.5
  expected_output_token_fraction: 0.5
  expected_retry_rate: 0.05
allowed_tools: &tools [linear-dependence, squared-dependence, distribution, stability, iid-gaussian-sharpe, mertens-psr, hac-sharpe, circular-block-bootstrap]
input_frequency: periodic-returns
periods_per_year: null
benchmark_sharpe: 0.0
method_metadata_version: phase1-method-catalog-1.0
confidence_level: 0.95
hac_bandwidth: 5
bootstrap_block_length: 10
bootstrap_replications: 50
bootstrap_seed: 42000000
loss_profile: validity-first
independent_review_complete: false
confirmation_run: false
