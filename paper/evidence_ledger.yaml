  - claim_id: statistical-outcome-definitions
    section: methods.statistical-definitions
    description: Deterministic definitions used for routing loss, oracle loss, invalid selection, harmful non-abstention, and claim validity.
    value:
      routing_loss: explicit policy-weighted sum of coverage, interval width, invalidity, harm, abstention, failure, and runtime components
      oracle_loss: minimum eligible-method-or-abstention loss for the matched cell
      invalid_selection: selected ineligible or target-not-well-defined method, or execution failure
      harmful_nonabstention: non-abstention when the target is undefined or no eligible method exists
      final_claim_valid: no execution failure and no invalid primary selection
      phase4j_routing_regret: routing_loss minus cell oracle loss
      phase5b_routing_regret: max(0, routing_loss minus cell oracle loss)
    units: deterministic metric definitions
    denominator: one matched system-cell or condition-cell outcome
    estimand: policy-weighted decision quality relative to a cell-specific oracle
    evidence_class: implementation-grounded
    claim_level: methodological-definition
    canonical_source: src/eri/benchmark/phase4b_evaluation.py
    source_sha256: 38acc8650bec0a8b1bc25cbef114564a6c658c2d6afeaba5d1bb2fc9c34f5474
