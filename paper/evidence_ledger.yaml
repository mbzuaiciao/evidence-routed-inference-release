interpretive_claims:
  directly_supported:
    - Richer instructions substantially improve B relative to A on this benchmark.
    - C has the lowest observed mean regret, zero invalid selection, zero harmful non-abstention, and full claim validity.
    - The tested specialized-persona workflow D performs worse than C.
    - The adaptive deterministic policy is the strongest deployable Phase 4J baseline by observed mean regret under the formalized benchmark conditions.
  pilot_descriptive_interpretation:
    - Instruction design appears to explain a substantial portion of the improvement over short monolithic prompting.
    - Unified sequential execution may prevent severe structural-break errors.
    - The tested specialized architecture is less robust than the unified sequential workflow on this benchmark.
  mechanistic_hypotheses_not_findings:
    - C may help by externally preserving intermediate state.
    - D may suffer from context fragmentation or interface boundaries.
    - Structured workflows may primarily improve tail-error prevention rather than ordinary-cell performance.
  unsupported:
    - Sequential execution is definitively the dominant mechanism.
    - C broadly and uniformly outperforms B.
    - Persona specialization is generally harmful.
    - Multi-agent systems are generally inferior.
    - C-D isolates a pure persona effect.
    - Phase 5B provides population-level significance.
    - All 216 planned calls were physically dispatched.
    - Exact token and cost numbers are original-artifact verified.

retired_main_text_values:
  - value: 1.403057
    quantity: Phase 5B Condition B mean routing regret
    replacement: 1.389345
    disposition: sensitivity-only
  - value: -1.152770
    quantity: Phase 5B C-minus-B mean paired regret
    replacement: -1.139058
    disposition: sensitivity-only
  - value: -3.320066
    quantity: Phase 5B B-minus-A mean paired regret
    replacement: -3.333777
    disposition: sensitivity-only

prohibited_central_claims:
  - Sequential execution is definitively the dominant mechanism.
  - Condition C broadly and uniformly outperforms Condition B.
  - Preregistered Case 3 is conclusively established.
  - Preregistered Case 4 is universally disconfirmed.
  - Persona specialization is generally harmful.
  - Multi-agent systems are generally inferior.
  - Condition C minus D isolates a pure persona effect.
  - Phase 5B establishes population-level significance.
  - All 216 planned Phase 5B calls were physically dispatched.
  - Phase 5B token totals and provider cost are original-artifact verified.
