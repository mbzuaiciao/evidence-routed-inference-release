benchmark_version: phase3a-0.1
run_label: smoke
output_root: runs/phase3a
confidence_level: 0.95
hac_bandwidth: 3
bootstrap_block_length: 5
bootstrap_replications: 20
bootstrap_seed: 7000
loss_profile: validity-first
oracle_training_seeds: [9101, 9102]
evaluation_seeds: [9201]
generate_figures: true
scenarios:
  - scenario_id: iid-gaussian-smoke
    family: iid-gaussian
    sample_size: 120
    parameters: {mean: 0.01, volatility: 0.10}
  - scenario_id: ar1-smoke
    family: ar1
    sample_size: 160
    parameters: {mean: 0.01, phi: 0.40, innovation_std: 0.09, burn_in: 150}
  - scenario_id: garch-smoke
    family: garch
    sample_size: 200
    parameters: {mean: 0.006, omega: 0.0002, alpha: 0.15, beta: 0.78, burn_in: 250}
  - scenario_id: structural-mean-break-smoke
    family: structural-break
    sample_size: 160
    parameters:
      variant: mean
      break_fraction: 0.50
      mean_1: -0.03
      mean_2: 0.05
      volatility_1: 0.10
      volatility_2: 0.10
